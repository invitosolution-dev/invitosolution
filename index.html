<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invito Solution | Modern Digital Product Engineering & Web Development Agency</title>
    <meta name="description" content="Invito Solution is a premier digital engineering studio specializing in high-speed static websites, dynamic web applications, e-commerce platforms, and cross-platform mobile apps." />
    <meta name="keywords" content="Invito Solution, Web Development, React, Vite, Tailwind CSS, Mobile Apps, E-Commerce, Digital Agency, Tirunelveli, Tamil Nadu" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invito Solution | Digital Product Engineering & Web Development" />
    <meta property="og:description" content="Transforming vision into scalable digital reality. High-speed web platforms, e-commerce, and mobile applications." />
    <meta property="og:image" content="/og-preview.png" />
    
    <!-- Performance Preconnects & DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts with Non-Render-Blocking swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Preload Primary Hero Visual (LCP Optimization) -->
    <link rel="preload" as="image" href="/hero-team.webp" type="image/webp" fetchpriority="high" />
    
    <!-- Invito Solution Brand Favicons & Touch Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body class="bg-white text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Netlify Form Detection for SPA Pre-processing -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <input type="text" name="referral_code" />
      <textarea name="brief"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
